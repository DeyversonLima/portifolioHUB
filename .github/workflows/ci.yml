name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar ferramentas
        run: npm ci
      - name: Auditar dependências
        run: npm audit --audit-level=moderate
      - name: Validar site e executar testes
        run: npm run check
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testar interface em desktop e mobile
        run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar Python
        run: python -m py_compile projetos-pessoais/telegram-bot/bot.py
      - name: Verificar dados sensíveis conhecidos
        shell: bash
        run: |
          ! grep -RInE '(TELEGRAM_BOT_TOKEN|api[_-]?key|secret)[[:space:]]*=[[:space:]]*["'"'][^$]' \
            --exclude-dir=.git --exclude-dir=node_modules .
