<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <p class="demo-badge">SIMULAÇÃO EDUCACIONAL</p>
        <h2>Validação de formulário</h2>
        <p>Este exemplo demonstra feedback de interface. Não realiza autenticação real nem envia dados.</p>
        <form id="loginForm">
            <div class="input-container">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
            </div>
            <div class="input-container">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <p id="form-message" aria-live="polite"></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
