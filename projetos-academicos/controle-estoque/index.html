<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Controle de Estoque</h1>
        
        <table id="tabela-estoque">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Adicionar</th>
                    <th>Remover</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produtos serão listados aqui -->
            </tbody>
        </table>

        <h2>Adicionar Produto</h2>
        <form id="form-adicionar">
            <label>Produto <input type="text" id="nome-produto" maxlength="80" required></label>
            <label>Quantidade <input type="number" id="quantidade-produto" min="0" step="1" required></label>
            <label>Preço <input type="number" id="preco-produto" min="0.01" step="0.01" required></label>
            <button type="submit">Adicionar Produto</button>
        </form>
        <p id="estoque-status" aria-live="polite"></p>
        <p class="scope-note">Demonstração local: os dados ficam somente neste navegador e não estão conectados ao arquivo SQL.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
